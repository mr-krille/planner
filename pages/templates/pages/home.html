<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .container { text-align: center; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 1rem; }
        p { color: #7f8c8d; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ message }}</h1>
        <p>This page was rendered on the server.</p>
    </div>
</body>
</html>
